config-version = 2

after-startup-command = []

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

[mode.main.binding]
    # 同一ワークスペース内のフォーカス移動 (vim 風 hjkl)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # 同一ワークスペース内でウィンドウ自体を並び替え (shift 付き)
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # ワークスペースへジャンプ
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # 現在のウィンドウを指定ワークスペースへ移動（フォーカスも追従）
    alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
    alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
    alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
    alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

    # ワークスペース左右移動（モニター内で循環）
    ctrl-left = 'workspace prev'
    ctrl-right = 'workspace next'
    alt-cmd-o = 'workspace-back-and-forth'

    # モニター間のフォーカス移動
    alt-ctrl-h = 'focus-monitor --wrap-around left'
    alt-ctrl-l = 'focus-monitor --wrap-around right'
    ctrl-up = 'focus-monitor --wrap-around prev'
    ctrl-down = 'focus-monitor --wrap-around next'

    # 今のウィンドウを隣モニターへ（フォーカスも追従）
    alt-shift-ctrl-h = 'move-node-to-monitor --focus-follows-window left'
    alt-shift-ctrl-l = 'move-node-to-monitor --focus-follows-window right'

    # 今のワークスペース全体を隣モニターへ
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # 設定リロード用の最小限のservice mode
    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 9'

[workspace-to-monitor-force-assignment]
    # 1〜4: 内蔵 Retina ディスプレイ
    1 = 'built-in'
    2 = 'built-in'
    3 = 'built-in'
    4 = 'built-in'
    # 5〜6: 外部ディスプレイ (DELL など)
    5 = ['DELL S2722QC', 'secondary']
    6 = ['DELL S2722QC', 'secondary']
    # 7〜9: Sidecar (iPad) があればそこへ、無ければフォールバック
    7 = ['Sidecar Display \(AirPlay\)', 'secondary', 'main']
    8 = ['Sidecar Display \(AirPlay\)', 'secondary', 'main']
    9 = ['Sidecar Display \(AirPlay\)', 'secondary', 'main']
