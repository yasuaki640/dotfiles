config-version = 2

after-startup-command = []

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = []

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6"]

on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

[mode.main.binding]
    # 同一ワークスペース内のフォーカス移動 (vim 風 hjkl)
    # VSCode の Option+J/K (範囲選択拡大/縮小) と競合するためコメントアウト
    # alt-h = 'focus left'
    # alt-j = 'focus down'
    # alt-k = 'focus up'
    # alt-l = 'focus right'

    # 同一ワークスペース内でウィンドウ自体を並び替え (shift 付き)
    # VSCode の Option+Shift+J/K (行移動) と競合するためコメントアウト
    # alt-shift-h = 'move left'
    # alt-shift-j = 'move down'
    # alt-shift-k = 'move up'
    # alt-shift-l = 'move right'

    # ワークスペースへジャンプ
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'

    # 現在のウィンドウを指定ワークスペースへ移動（フォーカスも追従）
    alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'

    # ワークスペース左右移動（モニター内で循環）
    ctrl-left = 'workspace prev'
    ctrl-right = 'workspace next'
    alt-cmd-o = 'workspace-back-and-forth'

    # モニター間のフォーカス移動
    alt-ctrl-h = 'focus-monitor --wrap-around left'
    alt-ctrl-l = 'focus-monitor --wrap-around right'
    ctrl-up = 'focus-monitor --wrap-around prev'
    ctrl-down = 'focus-monitor --wrap-around next'

    # 今のウィンドウを隣モニターへ（フォーカスも追従）
    alt-shift-ctrl-h = 'move-node-to-monitor --focus-follows-window left'
    alt-shift-ctrl-l = 'move-node-to-monitor --focus-follows-window right'

    # 今のワークスペース全体を隣モニターへ
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # 設定リロード用の最小限のservice mode
    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']

[workspace-to-monitor-force-assignment]
    # 1〜3: 内蔵 Retina ディスプレイ
    1 = 'built-in'
    2 = 'built-in'
    3 = 'built-in'
    # 4〜6: JAPANNEXT（aerospace list-monitors の名前 'JAPANNEXT.MNT' に正規表現マッチ）
    4 = 'JAPANNEXT'
    5 = 'JAPANNEXT'
    6 = 'JAPANNEXT'
